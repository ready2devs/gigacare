name: CI - GigaCare Verification & Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Crates Test & Quality
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt Check
        working-directory: crates
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        working-directory: crates
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo Test (All workspace crates)
        working-directory: crates
        run: cargo test --workspace

      - name: Rust Integration Tests
        working-directory: crates
        run: cargo test -p gigacare-core --test integration_tests --features integration

  desktop-build:
    name: Desktop Tauri Build (Windows x64)
    runs-on: windows-latest
    needs: rust-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: apps/desktop
        run: pnpm install

      - name: Frontend Build & Test
        working-directory: apps/desktop
        run: |
          pnpm test
          pnpm build

      - name: Build Tauri Desktop Bundle
        working-directory: apps/desktop
        run: pnpm tauri build

  android-build:
    name: Android Build & Assembly
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Assemble Android App
        working-directory: apps/android
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --stacktrace
