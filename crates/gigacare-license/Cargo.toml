[package]
name = "gigacare-license"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Validación de licencias JWT con RSA-256 para GigaCare"

[dependencies]
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# jsonwebtoken ya está en dependencies, se usa para firmar tokens de test