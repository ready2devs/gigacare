[package]
name = "gigacare-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Motor de lectura de registro Windows, desinstalación y residual sweeper para GigaCare"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
dirs = "5"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
