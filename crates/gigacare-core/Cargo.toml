[package]
name = "gigacare-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "Core orchestrator for GigaCare: Scanner, events, and scan_smart_care API"

[dependencies]
gigacare-config = { path = "../gigacare-config" }
gigacare-fs = { path = "../gigacare-fs" }
gigacare-hash = { path = "../gigacare-hash" }
gigacare-quarantine = { path = "../gigacare-quarantine" }
gigacare-vision = { path = "../gigacare-vision" }
gigacare-ai = { path = "../gigacare-ai" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
dirs = "5"
walkdir = "2"

[features]
default = []
integration = []

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread"] }
tempfile = "3"
filetime = "0.2"
mockall = "0.13"
wiremock = "0.6"