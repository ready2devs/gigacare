[package]
name = "gigacare-desktop"
version = "1.0.0"
description = "GigaCare Windows Desktop Application Shell"
edition = "2021"

[lib]
name = "gigacare_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
gigacare-core = { path = "../../../crates/gigacare-core" }
gigacare-config = { path = "../../../crates/gigacare-config" }
