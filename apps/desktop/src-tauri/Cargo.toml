[package]
name = "gigacare-desktop"
version = "1.0.1"
description = "GigaCare Windows Desktop Application Shell"
edition = "2021"

[lib]
name = "gigacare_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
gigacare-core = { path = "../../../crates/gigacare-core" }
gigacare-config = { path = "../../../crates/gigacare-config" }
gigacare-quarantine = { path = "../../../crates/gigacare-quarantine" }
gigacare-license = { path = "../../../crates/gigacare-license" }
gigacare-fs = { path = "../../../crates/gigacare-fs" }
gigacare-vision = { path = "../../../crates/gigacare-vision" }
gigacare-ai = { path = "../../../crates/gigacare-ai" }
gigacare-treemap = { path = "../../../crates/gigacare-treemap" }
gigacare-registry = { path = "../../../crates/gigacare-registry" }
gigacare-devcleaning = { path = "../../../crates/gigacare-devcleaning" }
jwalk = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
base64 = "0.22"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = ["Win32_Devices_PortableDevices", "Win32_System_Com", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
